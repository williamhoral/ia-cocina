<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Abuelita Cocinera IA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #d9383a;
            margin-bottom: 25px;
            font-size: 24px;
        }
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 15px;
        }
        button {
            background-color: #2b7a3e;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1e562b;
        }
        #resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #2b7a3e;
            border-radius: 4px;
            text-align: left;
            white-space: pre-line;
            font-size: 15px;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👵 La Abuelita Cocinera IA</h1>
    
    <label for="ingredientesInput">🍳 Ingredientes que tienes en casa:</label>
    <textarea id="ingredientesInput" placeholder="Ej: 2 huevos, un tomate, arroz cocinado..."></textarea>
    
    <button onclick="preguntarAbuelita()">🍳 ¡Preguntar a la Abuelita!</button>
    
    <div id="resultado">Las sugerencias de la abuelita aparecerán aquí... ✨</div>
</div>

<script>
async function preguntarAbuelita() { 
  const ingredientes = document.getElementById('ingredientesInput').value; 
  const resultadoDiv = document.getElementById('resultado'); 
  
  if (!ingredientes) { 
    alert('Por favor, escribe algún ingrediente.'); 
    return; 
  } 
  
  resultadoDiv.innerHTML = 'Pensando en qué cocinar... 👵✨'; 
  
  // Tu clave con el formato nuevo de Google (AQ...)
  const apiKey = "AQAb8RN6LcRkRitZK5ZYoq9D3sbei9MzgyEI5yilkaSnqzCHT2HA";
  
  // URL de conexión super directa sin intermediarios
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  
  try { 
    const response = await fetch(url, { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({
        contents: [{
          parts: [{ text: `Actúa como una abuela cocinera experta y cariñosa. Te daré una lista de ingredientes y debes sugerirme una o dos recetas fáciles que pueda preparar usándolos. Si faltan ingredientes básicos (como sal, agua o aceite), asume que los tengo. Usa emojis y un tono muy dulce. Ingredientes: ${ingredientes}` }]
        }]
      })
    }); 
    
    const data = await response.json(); 
    
    if (data.candidates && data.candidates[0].content.parts[0].text) { 
      resultadoDiv.innerHTML = data.candidates[0].content.parts[0].text; 
    } else { 
      resultadoDiv.innerHTML = 'La abuelita no pudo procesar la receta. Revisa la clave.'; 
    } 
  } catch (error) { 
    resultadoDiv.innerHTML = 'Error al conectar directo con el servidor de Google.'; 
  } 
}
</script>

</body>
</html>
